apiVersion: apps/v1
kind: Deployment
metadata:
  name: engli3m-api
  labels:
    app: engli3m-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: engli3m-api
  template:
    metadata:
      labels:
        app: engli3m-api
    spec:
      containers:
      - name: engli3m-api
        image: 380794909589.dkr.ecr.eu-north-1.amazonaws.com/engli3m-api:v1
        ports:
        - containerPort: 8000
          name: http

        imagePullPolicy: Always  
